[package]
name = "recon"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "A live Git diff tree and observed edit history for the terminal"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
# Recon only reads local repositories; keep release binaries free of SSH/OpenSSL.
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
globset = "0.4"
notify = "8"
ratatui = "0.29"
similar = "2"
serde = { version = "1", features = ["derive"] }
shlex = "2"
toml = "0.8"
tempfile = "3"

[dev-dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
